<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes rotateLoop {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-12px) scale(1.3); opacity: 0.9; }
      }
      .rotator {
        transform-origin: 1020px 200px;
        animation: rotateLoop 18s linear infinite;
      }
      .pulsing-orb {
        transform-origin: 1020px 200px;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .flowing-track {
        stroke-dasharray: 12 8;
        animation: dashFlow 5s linear infinite;
      }
      .particle-1 { animation: floatParticle 3.5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 4.8s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 3.2s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Background Glow Orbs -->
  <circle class="pulsing-orb" cx="1020" cy="200" r="110" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle cx="250" cy="180" r="160" fill="#0284c7" opacity="0.12" filter="url(#glow)" />

  <!-- Animated Floating Ambient Dots -->
  <circle class="particle-1" cx="350" cy="90" r="4" fill="#38bdf8" />
  <circle class="particle-2" cx="720" cy="110" r="5" fill="#818cf8" />
  <circle class="particle-3" cx="540" cy="310" r="3" fill="#c084fc" />
  <circle class="particle-1" cx="890" cy="280" r="4" fill="#38bdf8" />

  <!-- Content Left Block -->
  <!-- Top Badge -->
  <g transform="translate(80, 70)">
    <rect width="260" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#10b981" />
    <circle cx="18" cy="17" r="9" fill="#10b981" opacity="0.4" class="pulsing-orb" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Title -->
  <text x="80" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">
    Awesome <tspan fill="url(#primaryGrad)">Returns Management</tspan>
  </text>
  <text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" fill="#94a3b8">
    Platform &amp; Reverse Logistics Solutions
  </text>

  <!-- Tagline / Pills -->
  <text x="80" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#cbd5e1">
    SaaS Leaders · Open-Source RMS · Automated Exchanges · Carrier APIs
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(80, 290)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="38" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="14" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📦 $3.8B+ Market</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="175" height="38" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <text x="189" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔄 Exchange-First</text>

    <!-- Pill 3 -->
    <rect x="365" y="0" width="185" height="38" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
    <text x="379" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ 16+ SaaS &amp; OSS</text>
  </g>

  <!-- Right Visual: Reverse Logistics Cycle Diagram -->
  <!-- Outer Rotating Ring -->
  <circle class="rotator" cx="1020" cy="200" r="120" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="80 30 140 40" opacity="0.8" />
  <!-- Inner Rotating Ring Counter -->
  <circle cx="1020" cy="200" r="90" fill="none" stroke="#38bdf8" stroke-width="2" class="flowing-track" opacity="0.5" />
  <circle cx="1020" cy="200" r="60" fill="#1e1b4b" stroke="#818cf8" stroke-width="3" />

  <!-- Center Icon: Return / Exchange arrows -->
  <g transform="translate(1020, 200)">
    <path d="M -22,-6 C -22,-20 -8,-30 10,-28 C 22,-26 30,-16 32,-4 M 32,-4 L 34,-16 M 32,-4 L 20,-6" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 22,6 C 22,20 8,30 -10,28 C -22,26 -30,16 -32,4 M -32,4 L -34,16 M -32,4 L -20,6" fill="none" stroke="#c084fc" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Node Dots along circle -->
  <g class="rotator">
    <circle cx="1020" cy="80" r="9" fill="#38bdf8" stroke="#0f172a" stroke-width="3" />
    <circle cx="1140" cy="200" r="9" fill="#818cf8" stroke="#0f172a" stroke-width="3" />
    <circle cx="1020" cy="320" r="9" fill="#c084fc" stroke="#0f172a" stroke-width="3" />
    <circle cx="900" cy="200" r="9" fill="#10b981" stroke="#0f172a" stroke-width="3" />
  </g>
</svg>